name: Ansible Infrastructure

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Ansible configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      INVENTORY_DEV_POSTGRES_PASSWORD: synthetic-preflight-only-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install ansible-core==2.20.1
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Validate inventory
        env:
          # Только для разбора inventory; подключений к production нет.
          INVENTORY_PRODUCTION_HOST: 127.0.0.1
          INVENTORY_PRODUCTION_SSH_USER: synthetic-ci-user
          INVENTORY_PRODUCTION_DEPLOY_DIR: /tmp/inventory-production-validation
          INVENTORY_PRODUCTION_READINESS_ORIGIN: http://127.0.0.1:8081
        run: |
          ansible-inventory -i ansible/inventories/dev.yml --list >/dev/null
          ansible-inventory -i ansible/inventories/production.yml --list >/dev/null

      - name: Check playbook syntax
        run: |
          for playbook in ansible/preflight.yml ansible/prepare.yml ansible/cd.yml; do
            ansible-playbook \
              -i ansible/inventories/dev.yml \
              "$playbook" \
              --syntax-check
          done

      - name: Run local preflight
        run: |
          ansible-playbook \
            -i ansible/inventories/dev.yml \
            ansible/preflight.yml

      - name: Ensure environment files are not tracked
        run: |
          if git ls-files --cached | grep -E '(^|/)\.env$'; then
            echo "ERROR: An environment file is tracked by Git"
            exit 1
          fi
          git check-ignore -q .env
          git check-ignore -q ansible/.env
