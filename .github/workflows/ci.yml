name: CI

on:
  push:
    branches:
      - dev
      - main
      - 'ci/test'
      - 'feature/**'
      - 'codex/**'
  pull_request:
    branches:
      - dev
      - main
      - ci/test
  workflow_dispatch:

permissions:
  contents: read

env:
  # Фиктивное значение только для изолированных проверок CI.
  POSTGRES_PASSWORD: synthetic-ci-only-password

jobs:
  container-check:
    name: Container security check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check container configuration
        run: make container-check

  tests:
    name: Backend tests and mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: make test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  style:
    name: Code style and typing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check Ruff and mypy
        run: |
          mkdir -p reports/style
          docker build -q -f tests/docker/Dockerfile.test --target backend-test -t inventory-ci-quality .
          docker run --rm --user "$(id -u):$(id -g)" \
            -e RUFF_CACHE_DIR=/tmp/ruff-cache \
            -e MYPY_CACHE_DIR=/tmp/mypy-cache \
            -v "$PWD/reports/style:/reports" inventory-ci-quality sh -c '
            ruff check app tests > /reports/ruff.txt 2>&1; lint_status=$?
            ruff format --check app tests > /reports/format.txt 2>&1; format_status=$?
            mypy app > /reports/mypy.txt 2>&1; mypy_status=$?
            [ "$lint_status" -eq 0 ] && [ "$format_status" -eq 0 ] && [ "$mypy_status" -eq 0 ]
          '

      - name: Upload style reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: style-reports
          path: reports/style/
          if-no-files-found: warn
          retention-days: 14

  security:
    name: Static security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Bandit
        run: |
          mkdir -p reports/security
          docker build -q -f tests/docker/Dockerfile.test --target backend-test -t inventory-ci-security .
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/reports/security:/reports" inventory-ci-security \
            bandit -r app -f json -o /reports/bandit.json

      - name: Search secrets
        if: success() || failure()
        run: make security

      - name: Audit dependencies
        if: success() || failure()
        run: sh scripts/security.sh dependencies

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            reports/security/bandit.json
            reports/*/security/*.json
            reports/*/security/*.log
            reports/*/security/*.txt
          if-no-files-found: warn
          retention-days: 14

  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run migrations on isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          export TEST_HOST_REPORTS_DIR="$PWD/reports/migrations"
          export TEST_HOST_UID="$(id -u)"
          export TEST_HOST_GID="$(id -g)"
          mkdir -p "$TEST_HOST_REPORTS_DIR"

          compose() {
            docker compose --env-file /dev/null \
              -f tests/docker/docker-compose.test.yml \
              -p "inventory-ci-migrations-${GITHUB_RUN_ID}" "$@"
          }

          trap 'compose down --volumes' EXIT

          compose build backend-test db
          compose up -d --wait db
          compose run --rm --no-deps backend-test alembic upgrade head

  backup-restore:
    name: PostgreSQL backup and restore
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test backup and restore on isolated database
        shell: bash
        run: |
          set -euo pipefail
          export COMPOSE_FILE=tests/docker/docker-compose.test.yml
          export COMPOSE_PROJECT_NAME="inventory-ci-backup-${GITHUB_RUN_ID}"
          export TEST_HOST_REPORTS_DIR="$PWD/reports/backup"
          export TEST_HOST_UID="$(id -u)"
          export TEST_HOST_GID="$(id -g)"
          mkdir -p "$TEST_HOST_REPORTS_DIR"

          trap 'docker compose down --volumes' EXIT

          docker compose build db
          docker compose up -d --wait db

          docker compose exec -T db sh -c \
            'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE ci_restore_check (id integer PRIMARY KEY); INSERT INTO ci_restore_check VALUES (42);"'

          make backup

          backup_file="$(find backups -maxdepth 1 -name '*.dump' -type f -print -quit)"
          test -n "$backup_file"

          docker compose exec -T db sh -c \
            'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 \
            -c "DROP TABLE ci_restore_check;"'

          printf 'RESTORE\n' | make restore FILE="$backup_file"

          result="$(docker compose exec -T db sh -c \
            'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At \
            -c "SELECT id FROM ci_restore_check;"')"

          test "$result" = "42"
          echo "Backup и restore: OK"

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and export images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for service in backend nginx db; do
            docker build --pull --target "$service" -t "inventory-$service:ci-$GITHUB_SHA" .
          done
          for service in backend nginx db; do
            docker image inspect "inventory-$service:ci-$GITHUB_SHA" --format '{{.Id}} {{json .RepoDigests}}' > "artifacts/$service-image.txt"
            docker save "inventory-$service:ci-$GITHUB_SHA" | gzip > "artifacts/$service.tar.gz"
          done

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  image_scan:
    name: Trivy Image Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      fail-fast: false
      matrix:
        service: [backend, nginx, db]
    steps:
      - uses: actions/checkout@v4

      - name: Download images
        uses: actions/download-artifact@v4
        with:
          name: images-${{ github.sha }}
          path: artifacts

      - name: Load image and verify identity
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          gzip -dc "artifacts/$SERVICE.tar.gz" | docker load
          expected=$(cut -d ' ' -f 1 "artifacts/$SERVICE-image.txt")
          actual=$(docker image inspect "inventory-$SERVICE:ci-$GITHUB_SHA" --format '{{.Id}}')
          test "$actual" = "$expected"

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: inventory-${{ matrix.service }}:ci-${{ github.sha }}
          scanners: vuln
          format: json
          output: trivy-${{ matrix.service }}.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '0'
          timeout: 15m

      - name: Enforce image policy
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          result=$(python3 scripts/security_policy.py trivy "trivy-$SERVICE.json" 0)
          echo "$SERVICE: $result"
          test "$result" = SUCCESS

      - name: Upload image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}-${{ github.sha }}
          path: |
            trivy-${{ matrix.service }}.json
            artifacts/${{ matrix.service }}-image.txt
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish Docker images to GHCR
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs:
      - container-check
      - tests
      - style
      - security
      - migrations
      - backup-restore
      - build
      - image_scan
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download verified images
        uses: actions/download-artifact@v4
        with:
          name: images-${{ github.sha }}
          path: artifacts

      - name: Load verified images
        shell: bash
        run: |
          set -euo pipefail
          for service in backend nginx; do
            gzip -dc "artifacts/$service.tar.gz" | docker load
            expected=$(cut -d ' ' -f 1 "artifacts/$service-image.txt")
            actual=$(docker image inspect "inventory-$service:ci-$GITHUB_SHA" --format '{{.Id}}')
            test "$actual" = "$expected"
          done

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified images
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          for service in backend nginx; do
            # Сохраняем прежнее имя frontend в GHCR для образа Nginx со статикой.
            destination=$service
            if [ "$service" = nginx ]; then destination=frontend; fi
            image="ghcr.io/$repository/$destination:$GITHUB_SHA"
            docker tag "inventory-$service:ci-$GITHUB_SHA" "$image"
            docker push "$image"
          done
