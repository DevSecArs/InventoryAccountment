name: CI

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # Фиктивное значение только для изолированных проверок CI.
  POSTGRES_PASSWORD: synthetic-ci-only-password

jobs:
  container-check:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
    name: Container security check
    runs-on: [self-hosted, linux, x64, inventory-registry]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check container configuration
        run: make container-check

  tests:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
    name: Backend tests and mutation testing
    runs-on: [self-hosted, linux, x64, inventory-registry]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: make test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  style:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
    name: Code style and typing
    runs-on: [self-hosted, linux, x64, inventory-registry]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check Ruff and mypy
        run: |
          mkdir -p reports/style
          docker build -q -f tests/docker/Dockerfile.test --target backend-test -t inventory-ci-quality .
          docker run --rm --user "$(id -u):$(id -g)" \
            -e RUFF_CACHE_DIR=/tmp/ruff-cache \
            -e MYPY_CACHE_DIR=/tmp/mypy-cache \
            -v "$PWD/reports/style:/reports" inventory-ci-quality sh -c '
            ruff check app tests > /reports/ruff.txt 2>&1; lint_status=$?
            ruff format --check app tests > /reports/format.txt 2>&1; format_status=$?
            mypy app > /reports/mypy.txt 2>&1; mypy_status=$?
            [ "$lint_status" -eq 0 ] && [ "$format_status" -eq 0 ] && [ "$mypy_status" -eq 0 ]
          '

      - name: Upload style reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: style-reports
          path: reports/style/
          if-no-files-found: warn
          retention-days: 14

  security:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
    name: Static security analysis
    runs-on: [self-hosted, linux, x64, inventory-registry]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Bandit
        run: |
          mkdir -p reports/security
          docker build -q -f tests/docker/Dockerfile.test --target backend-test -t inventory-ci-security .
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/reports/security:/reports" inventory-ci-security \
            bandit -r app -f json -o /reports/bandit.json

      - name: Search secrets
        if: success() || failure()
        run: make security

      - name: Audit dependencies
        if: success() || failure()
        run: sh scripts/security.sh dependencies

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            reports/security/bandit.json
            reports/*/security/*.json
            reports/*/security/*.log
            reports/*/security/*.txt
          if-no-files-found: warn
          retention-days: 14

  migrations:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
    name: Database migrations
    runs-on: [self-hosted, linux, x64, inventory-registry]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run migrations on isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          export TEST_HOST_REPORTS_DIR="$PWD/reports/migrations"
          export TEST_HOST_UID="$(id -u)"
          export TEST_HOST_GID="$(id -g)"
          mkdir -p "$TEST_HOST_REPORTS_DIR"

          compose() {
            docker compose --env-file /dev/null \
              -f tests/docker/docker-compose.test.yml \
              -p "inventory-ci-migrations-${GITHUB_RUN_ID}" "$@"
          }

          trap 'compose down --volumes' EXIT

          compose build backend-test
          compose up -d --wait db
          compose run --rm --no-deps backend-test alembic upgrade head

  backup-restore:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
    name: PostgreSQL backup and restore
    runs-on: [self-hosted, linux, x64, inventory-registry]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test backup and restore on isolated database
        shell: bash
        run: |
          set -euo pipefail
          export COMPOSE_FILE=tests/docker/docker-compose.test.yml
          export COMPOSE_PROJECT_NAME="inventory-ci-backup-${GITHUB_RUN_ID}"
          export TEST_HOST_REPORTS_DIR="$PWD/reports/backup"
          export TEST_HOST_UID="$(id -u)"
          export TEST_HOST_GID="$(id -g)"
          mkdir -p "$TEST_HOST_REPORTS_DIR"

          trap 'docker compose down --volumes' EXIT

          docker compose up -d --wait db

          docker compose exec -T db sh -c \
            'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE ci_restore_check (id integer PRIMARY KEY); INSERT INTO ci_restore_check VALUES (42);"'

          make backup

          backup_file="$(find backups -maxdepth 1 -name '*.dump' -type f -print -quit)"
          test -n "$backup_file"

          docker compose exec -T db sh -c \
            'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 \
            -c "DROP TABLE ci_restore_check;"'

          printf 'RESTORE\n' | make restore FILE="$backup_file"

          result="$(docker compose exec -T db sh -c \
            'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At \
            -c "SELECT id FROM ci_restore_check;"')"

          test "$result" = "42"
          echo "Backup и restore: OK"

  build:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
    name: Build Docker images
    runs-on: [self-hosted, linux, x64, inventory-registry]
    timeout-minutes: 30
    outputs:
      backend_digest: ${{ steps.candidates.outputs.backend_digest }}
      backend_id: ${{ steps.candidates.outputs.backend_id }}
      nginx_digest: ${{ steps.candidates.outputs.nginx_digest }}
      nginx_id: ${{ steps.candidates.outputs.nginx_id }}
      db_digest: ${{ steps.candidates.outputs.db_digest }}
      db_id: ${{ steps.candidates.outputs.db_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and publish candidates
        id: candidates
        shell: bash
        run: |
          set -euo pipefail
          for service in backend nginx; do
            docker build --pull --build-arg "GIT_SHA=$GITHUB_SHA" --target "$service" -t "inventory-$service:ci-$GITHUB_RUN_ID" .
          done
          db_image=$(docker compose --env-file /dev/null config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["db"]["image"])')
          docker pull "$db_image"
          docker tag "$db_image" "inventory-db:ci-$GITHUB_RUN_ID"
          for service in backend nginx db; do
            destination=$service
            if [ "$service" = nginx ]; then destination=frontend; fi
            source="inventory-$service:ci-$GITHUB_RUN_ID"
            candidate="192.168.56.111:5000/inventory/$destination:candidate-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            image_id=$(docker image inspect "$source" --format '{{.Id}}')
            docker tag "$source" "$candidate"
            docker push "$candidate" | tee "${RUNNER_TEMP}/candidate-$service-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"
            digest=$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' "${RUNNER_TEMP}/candidate-$service-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log" | tail -n 1)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            reference="${candidate%:*}@$digest"
            docker pull "$reference"
            test "$(docker image inspect "$reference" --format '{{.Id}}')" = "$image_id"
            echo "${service}_digest=$digest" >> "$GITHUB_OUTPUT"
            echo "${service}_id=$image_id" >> "$GITHUB_OUTPUT"
          done

  image_scan:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
    name: Trivy Image Scan (${{ matrix.service }})
    runs-on: [self-hosted, linux, x64, inventory-registry]
    timeout-minutes: 30
    needs: build
    strategy:
      fail-fast: false
      matrix:
        service: [backend, nginx, db]
    steps:
      - uses: actions/checkout@v4

      - name: Pull candidate and verify identity
        id: candidate
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ needs.build.outputs[format('{0}_digest', matrix.service)] }}
          EXPECTED_ID: ${{ needs.build.outputs[format('{0}_id', matrix.service)] }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          destination=$SERVICE
          if [ "$SERVICE" = nginx ]; then destination=frontend; fi
          reference="192.168.56.111:5000/inventory/$destination@$DIGEST"
          docker pull "$reference"
          test "$(docker image inspect "$reference" --format '{{.Id}}')" = "$EXPECTED_ID"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ steps.candidate.outputs.reference }}
          scanners: vuln
          format: json
          output: trivy-${{ matrix.service }}.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '0'
          timeout: 15m

      - name: Enforce image policy
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          result=$(python3 scripts/security_policy.py trivy "trivy-$SERVICE.json" 0)
          echo "$SERVICE: $result"
          test "$result" = SUCCESS

      - name: Upload image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}-${{ github.sha }}
          path: |
            trivy-${{ matrix.service }}.json
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish verified images to local registry
    runs-on: [self-hosted, linux, x64, inventory-registry]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs:
      - container-check
      - tests
      - style
      - security
      - migrations
      - backup-restore
      - build
      - image_scan
    permissions:
      contents: read
    steps:
      - name: Promote verified candidates
        shell: bash
        env:
          BACKEND_DIGEST: ${{ needs.build.outputs.backend_digest }}
          NGINX_DIGEST: ${{ needs.build.outputs.nginx_digest }}
          DB_DIGEST: ${{ needs.build.outputs.db_digest }}
          BACKEND_ID: ${{ needs.build.outputs.backend_id }}
          NGINX_ID: ${{ needs.build.outputs.nginx_id }}
          DB_ID: ${{ needs.build.outputs.db_id }}
        run: |
          set -euo pipefail
          mkdir -p published
          for service in backend nginx db; do
            case "$service" in
              backend) digest=$BACKEND_DIGEST; expected_id=$BACKEND_ID; destination=backend ;;
              nginx) digest=$NGINX_DIGEST; expected_id=$NGINX_ID; destination=frontend ;;
              db) digest=$DB_DIGEST; expected_id=$DB_ID; destination=db ;;
            esac
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$expected_id" =~ ^sha256:[0-9a-f]{64}$ ]]
            repository="192.168.56.111:5000/inventory/$destination"
            docker pull "$repository@$digest"
            test "$(docker image inspect "$repository@$digest" --format '{{.Id}}')" = "$expected_id"
            skopeo copy --all --preserve-digests --src-tls-verify=false --dest-tls-verify=false \
              --digestfile "published/$service.digest" \
              "docker://$repository@$digest" "docker://$repository:$GITHUB_SHA"
            test "$(cat "published/$service.digest")" = "$digest"
            actual=$(skopeo inspect --tls-verify=false --raw "docker://$repository:$GITHUB_SHA" | sha256sum | cut -d ' ' -f 1)
            test "sha256:$actual" = "$digest"
            printf '%s@%s\n' "$repository" "$digest" > "published/$service-image.txt"
          done

      - name: Upload published image digests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: published/
          if-no-files-found: warn
          retention-days: 14

  deploy-staging:
    name: Deploy verified release to staging
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, linux, x64, inventory-registry]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout staging configuration
        uses: actions/checkout@v4

      - name: Download published image digests
        uses: actions/download-artifact@v4
        with:
          name: published-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: published

      - name: Deploy published images
        shell: bash
        run: |
          set -euo pipefail

          read_image() {
            local file="$1"
            local repository="$2"
            local reference prefix digest

            reference="$(cat "published/${file}-image.txt")"
            prefix="192.168.56.111:5000/inventory/${repository}@sha256:"

            [[ "$reference" == "$prefix"* ]] || {
              echo "Unexpected image repository: $file" >&2
              return 1
            }

            digest="${reference#"$prefix"}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || {
              echo "Invalid image digest: $file" >&2
              return 1
            }

            printf '%s' "$reference"
          }

          backend="$(read_image backend backend)"
          frontend="$(read_image nginx frontend)"
          db="$(read_image db db)"

          bash deploy/staging-request.sh \
            "$GITHUB_SHA" "$backend" "$frontend" "$db"
