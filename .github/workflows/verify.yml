name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: make verify TEST=1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Подготовить инструменты
        run: |
          corepack enable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Подготовить окружение
        run: make setup TEST=1

      - name: Выполнить обязательный контур
        run: make verify TEST=1

      - name: Сохранить отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-reports
          path: reports/
          if-no-files-found: warn
