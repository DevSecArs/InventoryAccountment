name: inventory-compose

services:
  db:
    image: postgres:17.6-bookworm
    user: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_inventory_password}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
    volumes:
      - inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      target: backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-inventory_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_inventory_password}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      target: frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      backend:
        condition: service_healthy

volumes:
  inventory_data:
