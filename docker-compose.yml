name: inventory-compose

services:
  db:
    cpus: 0.75
    mem_limit: 384m
    pids_limit: 100
    image: postgres:17.6-bookworm
    user: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_inventory_password}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
    volumes:
      - inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    cpus: 0.75
    mem_limit: 384m
    pids_limit: 100
    build:
      context: .
      target: backend
    deploy:
      replicas: 2
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-inventory_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_inventory_password}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    cpus: 1.0
    mem_limit: 1024m
    pids_limit: 100
    build:
      context: .
      target: frontend
    environment:
      VITE_API_PROXY_TARGET: http://nginx
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
  nginx:
    image: nginx:1.27.4-alpine
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 100
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health/live]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  inventory_data:
