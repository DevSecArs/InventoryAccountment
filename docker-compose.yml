name: inventory-compose

services:
  db:
    cpus: 0.75
    mem_limit: 384m
    pids_limit: 100
    image: 192.168.56.111:5000/inventory/postgres:17.11-gosu1.20-go1.27.4@sha256:6e9287c3a626921c4bd8ca3ad6e8c462018cb0673037c67d19a86d1730ef7de1
    user: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
    volumes:
      - inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    cpus: 0.75
    mem_limit: 384m
    pids_limit: 100
    build:
      context: .
      target: backend
    deploy:
      replicas: 2
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-inventory_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, /opt/app-root/src/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  nginx:
    build:
      context: .
      target: nginx
    user: "101:101"
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 100
    ports:
      - "8080:8080"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health/live]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  inventory_data:
