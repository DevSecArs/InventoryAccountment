services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: inventory_test
      POSTGRES_PASSWORD: isolated_test_password
      POSTGRES_DB: inventory_test
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - test_data:/var/lib/postgresql/data
    networks:
      - test_network

  backend-test:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.test
      target: backend-test
    user: "${TEST_HOST_UID:-1000}:${TEST_HOST_GID:-1000}"
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql://inventory_test:isolated_test_password@db:5432/inventory_test
      TEST_DATABASE_URL: postgresql://inventory_test:isolated_test_password@db:5432/inventory_test
    volumes:
      - ${TEST_HOST_REPORTS_DIR}:/workspace/reports
    networks:
      - test_network

  frontend-test:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.test
      target: frontend-test
    user: "${TEST_HOST_UID:-1000}:${TEST_HOST_GID:-1000}"
    environment:
      HOME: /tmp
      REPORT_DIR: /workspace/reports/frontend
    volumes:
      - ${TEST_HOST_REPORTS_DIR}:/workspace/reports
    networks:
      - test_network

  frontend-sast:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.test
      target: frontend-sast
    user: "${TEST_HOST_UID:-1000}:${TEST_HOST_GID:-1000}"
    volumes:
      - ${TEST_HOST_REPORTS_DIR}:/workspace/reports
    networks:
      - test_network

volumes:
  test_data:

networks:
  test_network:
    internal: true
