services:
  db:
    image: 192.168.56.111:5000/inventory/postgres:17.11-gosu1.20-go1.27.4@sha256:6e9287c3a626921c4bd8ca3ad6e8c462018cb0673037c67d19a86d1730ef7de1
    environment:
      POSTGRES_USER: inventory_test
      POSTGRES_PASSWORD: isolated_test_password
      POSTGRES_DB: inventory_test
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - test_data:/var/lib/postgresql/data
    networks:
      - test_network

  backend-test:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.test
      target: backend-test
    user: "${TEST_HOST_UID:-1000}:${TEST_HOST_GID:-1000}"
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql://inventory_test:isolated_test_password@db:5432/inventory_test
      TEST_DATABASE_URL: postgresql://inventory_test:isolated_test_password@db:5432/inventory_test
    volumes:
      - ${TEST_HOST_REPORTS_DIR}:/workspace/reports
    networks:
      - test_network

volumes:
  test_data:

networks:
  test_network:
    internal: true
