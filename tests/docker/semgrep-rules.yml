# Правила основаны на локальных правилах Semgrep Community Edition, редакция 1.99.0.
# Источник и лицензия: https://github.com/semgrep/semgrep-rules, LGPL-2.1.
rules:
  - id: local.javascript.security.audit.dangerous-html
    languages: [javascript]
    message: Опасная вставка HTML может привести к XSS.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $VALUE
          - pattern: $EL.outerHTML = $VALUE
          - pattern: $EL.insertAdjacentHTML(...)
  - id: local.javascript.security.audit.dynamic-code
    languages: [javascript]
    message: Динамическое выполнение кода небезопасно.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: new Function(...)
  - id: local.javascript.security.audit.document-write
    languages: [javascript]
    message: document.write может привести к XSS.
    severity: WARNING
    pattern: document.write(...)
