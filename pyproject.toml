[project]
name = "inventory-accountment"
version = "0.1.0"
description = "Складской учёт материалов"
authors = [{name = "Your Name", email = "your@email.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "bandit>=1.8.0",
    "pip-audit>=2.8.0",
    "mutmut>=3.3.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# На Windows bind mount Docker помечает все *.py исполняемыми, хотя Git хранит
# их с режимом 100644; EXE002 в таком окружении не отражает состояние проекта.
ignore = ["EXE002"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -p no:cacheprovider --cov=app.entities --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-report=html:reports/htmlcov --junitxml=reports/junit.xml"

[tool.coverage.run]
branch = true
source = ["app/entities"]
data_file = "reports/.coverage"

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.uv]
package = true
override-dependencies = [
    "jaraco.context>=6.1.0",
    "msgpack>=1.2.1",
    "setuptools>=80.0.0",
    "wheel>=0.46.2",
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.mutmut]
source_paths = ["app"]
only_mutate = ["app/entities/auth.py"]
pytest_add_cli_args_test_selection = ["tests"]
