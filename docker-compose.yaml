name: inventory-compose

x-backend: &backend
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  image: ${COMPOSE_PROJECT_NAME:-inventory-compose}-api:local
  build:
    context: .
    args:
      LOCAL_UID: ${LOCAL_UID:-1000}
      LOCAL_GID: ${LOCAL_GID:-1000}
    target: runtime
  environment:
    APP_ENV: development
    APP_DEBUG: "false"
    PGCONNECT_TIMEOUT: "10"
    POSTGRES_HOST: db
    POSTGRES_USER: ${POSTGRES_USER:-inventory_app}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_inventory_password}
    POSTGRES_DB: ${POSTGRES_DB:-inventory}

services:
  db:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "70:70"
    cpus: "1.0"
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    image: postgres:16.4-alpine
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_inventory_password}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
    volumes:
      - inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    image: ${COMPOSE_PROJECT_NAME:-inventory-compose}-migrate:local
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "1.0"
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    cpus: "1.0"
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    <<: *backend
    init: true
    stop_grace_period: 45s
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30

  frontend:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    cpus: "1.0"
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 128
    image: ${COMPOSE_PROJECT_NAME:-inventory-compose}-frontend:local
    init: true
    stop_grace_period: 15s
    build:
      context: .
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
      target: frontend
    environment:
      VITE_API_PROXY_TARGET: http://app:8000
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5180}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 30

  pg-tools:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    cpus: "1.0"
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    image: postgres:16.4-alpine
    profiles: ["tools"]
    environment:
      PGCONNECT_TIMEOUT: "10"
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-inventory_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:-local_inventory_password}
      PGDATABASE: ${POSTGRES_DB:-inventory}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro

volumes:
  inventory_data:
