name: inventory-manual

x-backend: &backend
  image: ${COMPOSE_PROJECT_NAME:-inventory-manual}-api:local
  build:
    context: ${INVENTORY_BUILD_CONTEXT:-.}
    target: runtime
  environment:
    APP_ENV: development
    APP_DEBUG: "false"
    DATABASE_URL: postgresql+psycopg2://manual_app:manual_local_password@db:5432/inventory_manual

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: manual_app
      POSTGRES_PASSWORD: manual_local_password
      POSTGRES_DB: inventory_manual
    volumes:
      - manual_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manual_app -d inventory_manual"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MANUAL_API_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30

  frontend:
    image: ${COMPOSE_PROJECT_NAME:-inventory-manual}-frontend:local
    build:
      context: ${INVENTORY_BUILD_CONTEXT:-.}
      target: frontend
    environment:
      VITE_API_PROXY_TARGET: http://app:8000
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MANUAL_FRONTEND_PORT:-5180}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  manual_data:
