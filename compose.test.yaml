services:
  db:
    cpus: "1.0"
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    image: postgres:16.4-alpine
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: inventory_test_app
      POSTGRES_PASSWORD: inventory_test_password
      POSTGRES_DB: inventory_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_test_app -d inventory_test"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  app:
    cpus: "2.0"
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 256
    init: true
    stop_grace_period: 45s
    build:
      context: .
      target: test
    environment:
      PGCONNECT_TIMEOUT: "10"
      APP_ENV: test
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://inventory_test_app:inventory_test_password@db:5432/inventory_test
      TEST_DATABASE_URL: postgresql+psycopg2://inventory_test_app:inventory_test_password@db:5432/inventory_test
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TEST_API_PORT:-8001}:8000"
    volumes:
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    cpus: "1.0"
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 128
    init: true
    stop_grace_period: 15s
    build:
      context: .
      target: frontend
    environment:
      VITE_API_PROXY_TARGET: http://app:8000
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TEST_FRONTEND_PORT:-5174}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  pg-tools:
    cpus: "1.0"
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    image: postgres:16.4-alpine
    profiles: ["tools"]
    environment:
      PGCONNECT_TIMEOUT: "10"
      APP_ENV: test
      PGCONNECT_TIMEOUT: "10"
      PGHOST: db
      PGPORT: "5432"
      PGUSER: inventory_test_app
      PGPASSWORD: inventory_test_password
      PGDATABASE: inventory_test
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro

volumes:
  postgres_test_data:
