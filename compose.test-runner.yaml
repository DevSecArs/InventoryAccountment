services:
  db:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "70:70"
    cpus: "1.0"
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: inventory_test_app
      POSTGRES_PASSWORD: inventory_test_password
      POSTGRES_DB: inventory_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_test_app -d inventory_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - test_data:/var/lib/postgresql/data
  tests:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    cpus: "2.0"
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 256
    image: inventory-accountment-tests:local
    environment:
      PGCONNECT_TIMEOUT: "10"
      APP_ENV: test
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://inventory_test_app:inventory_test_password@db:5432/inventory_test
      TEST_DATABASE_URL: postgresql+psycopg2://inventory_test_app:inventory_test_password@db:5432/inventory_test
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./reports/unix-tests:/app/reports
      - ./scripts/test-runner.mk:/app/scripts/test-runner.mk:ro
      - ./scripts/localize_test_output.py:/app/scripts/localize_test_output.py:ro
      - ./scripts/localize_test_output.mjs:/app/scripts/localize_test_output.mjs:ro
volumes:
  test_data:
